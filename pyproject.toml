[project]
name = "moments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Dene Hoffman", email = "nhoffman@wm.edu" }]
requires-python = ">=3.14"
dependencies = [
    "laddu>=0.25.0",
